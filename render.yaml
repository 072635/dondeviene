# Despliegue en Render (render.com): New → Blueprint → elige este repositorio.
#
# Plan gratis: para probar y presentar la app. Se "duerme" tras 15 minutos sin uso
# y los datos se borran al reiniciar (la cuenta de administración se vuelve a crear sola).
# Para operar con conductores reales cambia a plan: starter y descomenta el disco y DB_FILE.
services:
  - type: web
    name: dondeviene
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      # Sin cuentas de prueba en el servidor real.
      - key: DEMO
        value: "0"
      # Unidades simuladas en el mapa para presentar la app; se apagan desde el Tablero.
      - key: SIM
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@dondeviene.mx
      - key: ADMIN_PASSWORD
        sync: false
      # - key: DB_FILE
      #   value: /var/data/dondeviene.db
    # disk:
